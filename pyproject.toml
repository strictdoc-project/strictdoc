#
# @relation(SDOC-SRS-8, scope=file)
#

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "strictdoc/__init__.py"

[tool.hatch.build]
exclude = [
    # Without this, the folder is still included to the output tar.gz because it has a Markdown file.
    "/developer",
]

[tool.hatch.build.targets.sdist]
include = [
    "/strictdoc/",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml"
]

[tool.hatch.build.targets.wheel]
include = [
    "/strictdoc/",
]

[project]
name = "strictdoc"
dynamic = ["version"]
description = "StrictDoc is open-source software for technical documentation and requirements management."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Stanislav Pankevich", email = "s.pankevich@gmail.com" },
    { name = "Maryna Balioura", email = "mettta@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

# @relation(SDOC-SRS-89, scope=range_start)
dependencies = [
    "textx >= 4.0.0, == 4.*",
    "lark >= 1.2.2",

    "jinja2 >= 2.11.2",
    # Reading project config from strictdoc.toml file.
    "toml",

    # ParamSpec/TypeAlias, used directly by strictdoc/helpers/timing.py,
    # strictdoc/helpers/form_data.py, and others.
    "typing-extensions",

    # Parsing and rendering RST.
    "docutils >= 0.22.2, == 0.*",

    # Parsing Markdown in CommonMark mode. Converting Markdown to HTML.
    "markdown-it-py >= 4.0.0, == 4.*",

    # Tree Sitter is used for language/AST-aware parsing of Python, C and other files.
    "tree-sitter == 0.25.2",
    "tree-sitter-c",
    "tree_sitter_cpp",
    "tree-sitter-python",
    "tree-sitter-rust",

    # Requirements-to-source traceability. Colored syntax for source files.
    "pygments == 2.21.0",

    # Faster JSON serialization for Static HTML search.
    "orjson",

    # Static HTML export with embedded assets.
    "beautifulsoup4 >= 4.12.0, == 4.*",
    "html5lib>=1.1",  # Used by beautifulsoup4 as an optional plugin.
    "python-datauri >= 2.1.1, == 2.*",

    # Excel
    "XlsxWriter >= 1.3.7, == 3.*",
    "xlrd >= 2.0.1, == 2.*",
    "openpyxl >= 3.1.0",

    # ReqIF
    # @relation(SDOC-SRS-73, scope=line)
    "reqif >= 0.1.0, == 0.1.*",

    # SPDX
    "spdx-tools >= 0.8.5",

    # Web server dependencies
    "fastapi >= 0.83.0",
    # FastAPI: To receive uploaded files and/or form data, first install python-multipart.
    "python-multipart",
    "uvicorn[standard] >= 0.14.0",
    "WebSockets",
    # Watching project files for the server's --watch live-reload.
    "watchdog >= 2.1.7",

    # HTML2PDF dependencies
    "html2pdf4doc == 0.0.34",
    "pypdf==6.*,>=6.5.0",

    # Robot Framework dependencies
    "robotframework >= 4.0.0",

    # Tree map graphs.
    "plotly",
    "pandas"
]
# @relation(SDOC-SRS-89, scope=range_end)

[project.optional-dependencies]
# Not used by tasks.py (which pip-installs these via requirements.bootstrap.txt
# instead). This extra exists for flake.nix, so that `nix develop` can build
# a fully Nix-provided invoke+uv without a network round trip; from there,
# invoke shells out to `uv sync` for every task-specific dependency group.
development = [
    "invoke>=1.4.1",
    "uv",
]
nuitka = [
    # Nuitka:WARNING: Using very slow fallback for ordered sets, please install
    # 'ordered-set' PyPI package for best Python compile time performance.
    "nuitka",
    "ordered-set",
]

[project.scripts]
strictdoc = "strictdoc.cli.main:main"

[project.urls]
Changelog = "https://github.com/strictdoc-project/strictdoc/blob/main/CHANGELOG.md"
Homepage = "https://strictdoc.readthedocs.io/en/stable/"
Source = "https://github.com/strictdoc-project/strictdoc"

# All groups below correspond to the per-flavor virtual environments in
# tasks.py's UvEnvironment (development/check/documentation/release/
# release-local/pyinstaller), each installed via
# `uv sync --no-install-project --group <flavor>`. `uv sync` always resolves
# [project.dependencies] alongside the selected group, so groups only list
# extras not already covered there.
[dependency-groups]
development = []
check = [
    # Lint
    "mypy>=0.910,<2.4",
    "ruff>=0.9",
    "fixit",

    # Lint - JS
    "jsbeautifier",

    # Unit tests
    "pytest>=6.2.2",
    # Pytest fixture that provides fake file system for testing code that
    # accesses file systems.
    "pyfakefs>=4.5.5",
    "coverage>=5.4",
    # httpx is needed for running server-related unit tests.
    "httpx",
    # This is needed for converting Gcov coverage files to a human-readable
    # JSON format.
    "gcovr>=8.3",

    # Integration tests
    # lit>=23 rejects the truthy-string "0" workaround previously used to
    # force execute_external=True; the lit.cfg.py now relies on lit's
    # internal shell (execute_external=False), which requires lit>=23.
    # FIXME: Migrate the test suite to support the internal shell calls.
    "lit==23.1.0",
    "filecheck>=0.0.20,<1.0.0",
    "pytidylib>=0.3.2",
    # Pinned exactly (narrower than the project's own ">=6.5.0, ==6.*") to
    # keep the HTML2PDF integration tests validated against a known-good
    # pypdf release; text-extraction behavior has changed across 6.x.
    "pypdf==6.16.1",

    # End2end tests.
    # A bare "seleniumbase" leads uv's resolver into an ancient 1.x branch
    # (pulled in by an unrelated combination of pins elsewhere in this
    # group) whose pyvirtualdisplay dependency fails to build against
    # modern setuptools; pip resolved a current release here, so pin the
    # floor to keep uv on the same modern branch.
    "seleniumbase>=4",

    # Screencast video generation (tests/screencast)
    "playwright",

    # psutil is needed to reap Uvicorn's zombie processes when running
    # end2end tests. One day someone finds a better solution.
    "psutil",

    # Used by the dead links checker
    "requests>=2.27.1",
]
documentation = []
release = ["build", "twine"]
release-local = [{ include-group = "release" }, { include-group = "check" }]
pyinstaller = [
    "pyinstaller",
    # FIXME: jaraco.text is needed because without it there is a regression
    # (started on 2025-11-23):
    # $ /tmp/strictdoc/strictdoc/strictdoc
    # Traceback (most recent call last):
    # File "pyi_rth_pkgres.py", line 177, in <module>
    # File "pyi_rth_pkgres.py", line 44, in _pyi_rthook
    # File "pyimod02_importers.py", line 457, in exec_module
    # File "pkg_resources/__init__.py", line 90, in <module>
    # ModuleNotFoundError: No module named 'jaraco'
    # [PYI-21537:ERROR] Failed to execute script 'pyi_rth_pkgres' due to unhandled exception!
    "jaraco.text",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
cache_dir = "build/pytest_cache/default"
pythonpath = [
  "."
]

[tool.fixit]
enable = [
    ".developer.fixit.check_comments",
    ".developer.fixit.check_docstrings",
]

# FIXME: Remove disable.
disable = [
    "fixit.rules"
]
