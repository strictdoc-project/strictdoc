#
# @relation(SDOC-SRS-46, scope=file)
#

name: "StrictDoc - End-to-end tests"

on:
  pull_request:
    branches: [ "**" ]

# One group per PR. A new push to a PR cancels the previous run of the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_end2end_macos:
    name: E2E - macOS
    runs-on: macos-latest

    # All PRs share one queue per matrix job. The queue starts jobs in push
    # order. As a result, the earliest push gets all its jobs done first.
    # Without the queue, every PR waits for the jobs of every other PR.
    concurrency:
      # strategy.job-index gives each matrix job its own queue.
      group: ${{ github.workflow }}-end2end_macos-${{ strategy.job-index }}
      # Keep up to 100 waiting jobs. The default keeps only the newest one.
      queue: max
      # Jobs of other PRs keep their place in the queue. A new push to the
      # same PR still cancels the old run through the workflow-level group.
      cancel-in-progress: false

    strategy:
      matrix:
        shard: [
          "1/4", "2/4",
          "3/4", "4/4",
        ]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: Run Lint tasks
      run: |
        invoke lint

    - name: Run end-to-end tasks
      run: |
        invoke test-end2end --long-timeouts --shard=${{ matrix.shard }} --exit-first --headless

  tests_end2end_linux:
    name: E2E - Linux
    runs-on: ubuntu-latest

    # One queue per matrix job, as in tests_end2end_macos.
    concurrency:
      group: ${{ github.workflow }}-end2end_linux-${{ strategy.job-index }}
      queue: max
      cancel-in-progress: false

    strategy:
      matrix:
        python-version: ["3.10"]
        shard: ["1/2", "2/2"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: "${{ matrix.python-version }}"

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: Run Lint tasks
      run: |
        invoke lint

    - name: Run end-to-end tasks
      run: |
        invoke test-end2end --long-timeouts --shard=${{ matrix.shard }} --exit-first --headless

  build:
    name: E2E - Windows
    runs-on: windows-latest

    # One queue per matrix job, as in tests_end2end_macos.
    concurrency:
      group: ${{ github.workflow }}-end2end_windows-${{ strategy.job-index }}
      queue: max
      cancel-in-progress: false

    strategy:
      matrix:
        shard: [
          "1/4", "2/4",
          "3/4", "4/4",
        ]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: "Windows specific: Install StrictDoc's and Check dependencies (everything for test)"
      run: |
        uv sync --frozen --active --no-install-project --group check

    - name: Run Lint tasks
      run: |
        invoke lint

    - name: Run end-to-end tasks
      run: |
        invoke test-end2end --long-timeouts --exit-first --shard=${{ matrix.shard }} --headless
