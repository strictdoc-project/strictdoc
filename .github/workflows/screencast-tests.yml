name: "StrictDoc - Screencast tests"

on:
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_screencast:
    name: Screencast
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: Prepare the check uv environment and Playwright's browser binary
      run: |
        UV_PROJECT_ENVIRONMENT=build/uv/check uv sync --frozen --no-install-project --group check
        ./build/uv/check/bin/python -m playwright install --with-deps chromium

    - name: Run screencast tests
      run: |
        invoke test-screencast
