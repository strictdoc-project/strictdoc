#
# @relation(SDOC-SRS-10, scope=file)
#

name: "StrictDoc on macOS"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

# One group per PR. A new push to a PR cancels the previous run of the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    # All PRs share one queue per matrix job. The queue starts jobs in push
    # order. As a result, the earliest push gets all its jobs done first.
    # Without the queue, every PR waits for the jobs of every other PR.
    concurrency:
      # strategy.job-index gives each matrix job its own queue.
      group: ${{ github.workflow }}-lint_and_test-${{ strategy.job-index }}
      # Keep up to 100 waiting jobs. The default keeps only the newest one.
      queue: max
      # Jobs of other PRs keep their place in the queue. A new push to the
      # same PR still cancels the old run through the workflow-level group.
      cancel-in-progress: false

    strategy:
      matrix:
        python-version: [
          "3.10", "3.14"
        ]
        itest_group: [ "main_group", "html2pdf_group" ]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: Run Lint tasks
      run: |
        invoke lint

    - name: Run tests
      run: |
        if [ "${{ matrix.itest_group }}" = "html2pdf_group" ]; then
          invoke test-integration --html2pdf
        else
          invoke test
        fi
