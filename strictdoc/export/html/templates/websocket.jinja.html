{%- if view_object.project_config.is_running_on_server -%}

{# It is important that there are no spaces within this element #connection_status: #}
<sdoc-toast id="connection_status"></sdoc-toast>

<script>
  var clientId = Date.now();
  var ws_protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  var ws = new WebSocket(`${ws_protocol}//${window.location.host}/ws/${clientId}`);
  ws.onmessage = function(event) {
    if (event.data === "reload") {
      window.location.reload();
    } else if (event.data === "project-settings:reload") {
      window.location.reload();
    } else if (event.data.indexOf("project-settings:error:") === 0) {
      const reloadContainer = document.querySelector(
        "[data-js-project-settings-reload-blocking]"
      );
      if (reloadContainer) {
        reloadContainer.removeAttribute(
          "data-js-project-settings-reload-blocking"
        );
        reloadContainer.querySelector(
          "[data-js-project-settings-reload-message]"
        ).textContent = event.data.slice("project-settings:error:".length);
        reloadContainer.querySelector(
          "[data-js-project-settings-reload-spinner]"
        ).hidden = true;
      }
    } else if (event.data.indexOf("error:") === 0) {
      document.getElementById("connection_status").innerHTML = `
        Document build failed. Fix the source files and save again.
        <pre style="white-space: pre-wrap;">${event.data.slice("error:".length)}</pre>
      `;
    }
  };
  ws.onopen = function(e) {
    // Nothing just yet.
  }
  ws.onclose = function(e) {
    document.getElementById("connection_status").innerHTML = `
      Connection with the server is lost.
      <a href="#" onclick="location.reload(); return false;">Click to reload</a>
    `;
  };
  window.onbeforeunload = function (e) {
    // Suprisingly, the last milleseconds of the page lifecycle let the page
    // still update its HTML which creates a visual artefact when refreshing the
    // page in the browser continuously.
    // This event ensures that we disable websockets when the page is about to
    // be refreshed/left.
    ws.onclose = null;
  };

</script>

{%- endif -%}
