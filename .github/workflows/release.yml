name: StrictDoc Python Package Release

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  deploy:
    # Disabled on this fork: this workflow publishes the "strictdoc" package
    # name to PyPI, which belongs to the upstream strictdoc-project. Leave
    # this guard in place unless this fork gets its own package identity and
    # a real release process.
    if: false
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

#    - name: Build and test locally
#      run: |
#        invoke release-local

    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        invoke release
