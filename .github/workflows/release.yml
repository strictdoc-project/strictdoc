name: StrictDoc Python Package Release

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

#    - name: Build and test locally
#      run: |
#        invoke release-local

    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        invoke release

  pyinstaller:
    name: PyInstaller binary – ${{ matrix.os }}
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: strictdoc/strictdoc
          - os: macos-latest
            binary: strictdoc/strictdoc
          - os: windows-latest
            binary: strictdoc/strictdoc.exe
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install minimal Python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.bootstrap.txt

    - name: Build using PyInstaller
      run: |
        invoke release-pyinstaller --output-dir build/pyinstaller_dist

    # Test the zip that gets uploaded. The lit RUN: lines need an absolute
    # path with forward slashes, also on Windows (Git Bash).
    - name: Test the PyInstaller-based StrictDoc from the zip
      run: |
        unzip -q build/pyinstaller_dist/strictdoc-*.zip -d build/pyinstaller_unzipped
        root="$(pwd -W 2>/dev/null || pwd)"
        invoke test-integration --strictdoc "$root/build/pyinstaller_unzipped/${{ matrix.binary }}"

    - name: Attach the zip to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" build/pyinstaller_dist/strictdoc-*.zip --clobber
