name: "StrictDoc - Screencast tests"

on:
  pull_request:
    branches: [ "**" ]

# One group per PR. A new push to a PR cancels the previous run of the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_screencast:
    name: Screencast
    runs-on: ubuntu-latest

    # All PRs share one queue for this job. The queue starts jobs in push
    # order. As a result, the earliest push gets all its jobs done first.
    # Without the queue, every PR waits for the jobs of every other PR.
    concurrency:
      group: ${{ github.workflow }}-screencast
      # Keep up to 100 waiting jobs. The default keeps only the newest one.
      queue: max
      # Jobs of other PRs keep their place in the queue. A new push to the
      # same PR still cancels the old run through the workflow-level group.
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: Prepare the check uv environment and Playwright's browser binary
      run: |
        UV_PROJECT_ENVIRONMENT=build/uv/check uv sync --frozen --no-install-project --group check
        ./build/uv/check/bin/python -m playwright install --with-deps chromium

    - name: Run screencast tests
      run: |
        invoke test-screencast
