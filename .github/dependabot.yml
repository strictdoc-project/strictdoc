version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: friday
    allow:
      - dependency-type: development
    ignore:
      - dependency-name: filecheck
      # FIXME: Ignored until the itests are migrated to LIT's native shell
      # syntax.
      - dependency-name: lit
    groups:
      python-packages:
        patterns: ["*"]
    commit-message:
      prefix: chore
