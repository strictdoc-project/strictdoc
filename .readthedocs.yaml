# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    # Install this fork's own checked-out code. (Upstream's own RTD config
    # force-installs strictdoc-project/strictdoc@main here instead; doing
    # that on this fork would build the docs with upstream's code rather
    # than this fork's.)
    - pip install -U .

    # Export documentation to HTML.
    - strictdoc export . --formats=html --output $READTHEDOCS_OUTPUT/
