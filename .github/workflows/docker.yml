name: StrictDoc Docker CI

on:
  pull_request:
    branches: [ "**" ]

# One group per PR. A new push to a PR cancels the previous run of the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # All PRs share one queue for this job. The queue starts jobs in push
    # order. As a result, the earliest push gets all its jobs done first.
    # Without the queue, every PR waits for the jobs of every other PR.
    concurrency:
      group: ${{ github.workflow }}-build_and_test
      # Keep up to 100 waiting jobs. The default keeps only the newest one.
      queue: max
      # Jobs of other PRs keep their place in the queue. A new push to the
      # same PR still cancels the old run through the workflow-level group.
      cancel-in-progress: false

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 5

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install minimal Python packages
      run: |
        pip install -r requirements.bootstrap.txt

    - name: Run Lint tasks
      run: |
        invoke lint

    - name: Build Docker image with PR branch
      run: |
        invoke build-docker \
          --image pr-${{ github.event.pull_request.number }} \
          --source=${{ github.event.pull_request.head.sha }}

    - name: Set permissions for the output folder.
      run: |
        mkdir -p output/ && chmod 777 output/

    - name: Run container and test StrictDoc installation
      run: |
        invoke test-docker \
          --image pr-${{ github.event.pull_request.number }}
